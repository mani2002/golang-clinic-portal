<!DOCTYPE html>
<html>
<head>
  <title>Patients - Clinic Portal</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .container {
      background: #fff;
      padding: 2rem 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 4px 32px rgba(44,62,80,0.13);
      width: 100%;
      max-width: 900px;
      margin: 3rem auto;
    }
    h2 {
      text-align: center;
      margin-bottom: 2rem;
    }
    .btn-link {
      margin-bottom: 1rem;
      display: inline-block;
      color: #554fc6;
      font-weight: bold;
      text-decoration: none;
      transition: color 0.2s;
    }
    .btn-link:hover {
      text-decoration: underline;
      color: #3225a5;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      box-shadow: 0 2px 10px rgba(44,62,80,0.08);
      background: #fff;
      font-size: 1rem;
    }
    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
    }
    th {
      background: #eceafd;
      color: #254176;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    tr:nth-child(odd) {
      background: #f8f7fc;
    }
    tr:hover {
      background: #ebeafc;
    }
    .actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }
    .btn.delete {
        background: none;
        display: inline-block;
        border: none;
        padding: 0;
        font: inherit;        
        color: #554fc6;       
        font-weight: bold;
        cursor: pointer;
    }
    .btn.delete:hover,
    .btn.delete:focus  {
        background: none;
        color: #3225a5;       
        border: none;
        padding: 0;
        text-decoration: none;
        outline: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Patients List</h2>
    {{if eq .role "receptionist"}}
      <a href="/patients/new" class="btn-link">+ Add Patient</a>
    {{end}}
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Detail</th>
          <th>Actions</th>
          {{if eq $.role "receptionist"}}
            <th>🗑️</th>
          {{end}}
        </tr>
      </thead>
      <tbody>
        {{range .patients}}
        <tr>
          <td>{{.Name}}</td>
          <td>{{.Age}}</td>
          <td>{{.Detail}}</td>
          <td class="actions">
            <a href="/patients/edit/{{.ID}}" class="btn-link">Edit</a>
            
          </td>
          {{if eq $.role "receptionist"}}
          <td>
              <form method="POST" action="/patients/delete/{{.ID}}" style="display:inline;">
                <button type="submit" class="btn delete">Delete</button>
              </form> 
          </td>
          {{end}}
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
</body>
</html>
